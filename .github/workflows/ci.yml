name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          for f in api/requirements.txt tests/trust/requirements.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done
          pip install pytest flake8 mypy
      - name: pytest
        env:
          FO_MOCK: "1"
        run: |
          if ls api/tests/*.py tests/trust/*.py >/dev/null 2>&1; then
            python -m pytest -q --ignore=tests/trust/test_api_live.py
          else
            echo "no tests yet"
          fi
      - name: flake8
        run: python -m flake8 .
      - name: mypy
        run: |
          if ls api/app/*.py trust/*.py >/dev/null 2>&1; then
            python -m mypy
          else
            echo "nothing to type-check yet"
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          else
            echo "no web app yet"
          fi
